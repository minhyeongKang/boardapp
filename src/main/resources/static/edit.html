<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BoardApp - Edit</title>
    <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">BoardApp</div>

        <div class="icon-actions">
            <!-- 돌아가기 -->
            <button class="icon-action" id="btnBack" title="돌아가기" type="button">
                <svg viewBox="0 0 24 24">
                    <polyline points="15 18 9 12 15 6"></polyline>
                    <line x1="9" y1="12" x2="21" y2="12"></line>
                </svg>
            </button>

            <!-- 로그아웃 -->
            <button class="icon-action" id="btnLogout" title="로그아웃" type="button">
                <svg viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </div>
</header>

<main class="container">
    <div class="panel">
        <div class="card form-card">
            <div class="section-title">게시글 수정</div>

            <div class="form-row">
                <label for="title">제목</label>
                <input id="title" placeholder="제목을 입력하세요" />
            </div>

            <div class="form-row">
                <label for="content">내용</label>
                <textarea id="content" placeholder="내용을 입력하세요"></textarea>
            </div>

            <div class="row-actions">
                <button class="pill-btn" id="btnCancel" type="button">취소</button>
                <button class="primary-btn" id="btnSave" type="button">저장</button>
            </div>

            <p id="msg" class="muted" style="margin:12px 0 0;"></p>
        </div>
    </div>
</main>

<script src="/js/auth.js"></script>
<script>
    requireAuth();

    const params = new URLSearchParams(location.search);
    const boardId = params.get("boardId");

    document.getElementById("btnBack").onclick = () => history.back();
    document.getElementById("btnCancel").onclick = () => history.back();
    document.getElementById("btnLogout").onclick = logout;

    async function loadBoard(){
      if(!boardId){
        document.getElementById("msg").textContent = "boardId가 없습니다.";
        return;
      }

      const res = await apiFetch("/api/boards/" + encodeURIComponent(boardId));
      if(!res) return;

      if(!res.ok){
        const t = await res.text().catch(() => "");
        document.getElementById("msg").textContent = "불러오기 실패: " + (t || res.status);
        return;
      }

      const b = await res.json();
      document.getElementById("title").value = b.title || "";
      document.getElementById("content").value = b.content || "";
    }

    document.getElementById("btnSave").onclick = async () => {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      const msg = document.getElementById("msg");

      if(!title || !content){
        msg.textContent = "제목과 내용을 모두 입력해주세요.";
        return;
      }

      const res = await apiFetch("/api/boards/" + encodeURIComponent(boardId), {
        method: "PUT",
        body: JSON.stringify({ title, content })
      });

      if(!res) return;

      if(res.ok){
        location.href = "/mypage.html";
      } else {
        const t = await res.text().catch(() => "");
        msg.textContent = "저장 실패: " + (t || res.status);
      }
    };

    loadBoard();
</script>

</body>
</html>
