<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoardApp - MyPage</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">BoardApp</div>
    <div class="actions">
      <button class="pill-btn" id="btnMain" type="button">메인</button>
      <button class="pill-btn" id="btnLogout" type="button">로그아웃</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="panel">
    <div class="page-title">마이페이지</div>

    <section class="card">
      <div class="profile">
        <div class="avatar"></div>

        <div class="profile-info" style="width:100%;">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
            <div>
              <p class="big" id="nicknameText">-</p>
              <p class="small" id="emailText">-</p>
            </div>
            <button class="pill-btn" id="btnEdit" type="button">프로필 수정</button>
          </div>

          <p class="bio" id="introText">-</p>

          <div id="editBox" style="display:none; margin-top:12px;">
            <div class="form-row">
              <label for="nicknameInput">닉네임</label>
              <input id="nicknameInput" class="auth-input" placeholder="닉네임" />
            </div>

            <div class="form-row">
              <label for="introInput">소개</label>
              <textarea id="introInput" class="auth-textarea" rows="3" placeholder="소개를 입력하세요"></textarea>
            </div>

            <div class="row-actions">
              <button class="pill-btn" id="btnCancelEdit" type="button">취소</button>
              <button class="primary-btn" id="btnSaveEdit" type="button">저장</button>
            </div>

            <p id="editMsg" class="auth-msg" style="margin-top:10px;"></p>
          </div>
        </div>
      </div>
    </section>

    <div style="height:14px;"></div>

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div class="page-title" style="margin:0;">내 게시글</div>
      <button class="pill-btn" id="btnRefresh" type="button">새로고침</button>
    </div>

    <div id="mine" class="grid"></div>
    <div id="emptyMine" class="empty" style="display:none;">아직 작성한 게시글이 없습니다.</div>
  </div>
</main>

<script src="/js/auth.js"></script>
<script>
  requireAuth();

  document.getElementById("btnMain").onclick = () => location.href = "/main.html";
  document.getElementById("btnLogout").onclick = logout;
  document.getElementById("btnRefresh").onclick = loadMine;

  const nicknameText = document.getElementById("nicknameText");
  const emailText = document.getElementById("emailText");
  const introText = document.getElementById("introText");

  const btnEdit = document.getElementById("btnEdit");
  const editBox = document.getElementById("editBox");
  const btnCancelEdit = document.getElementById("btnCancelEdit");
  const btnSaveEdit = document.getElementById("btnSaveEdit");
  const editMsg = document.getElementById("editMsg");

  const nicknameInput = document.getElementById("nicknameInput");
  const introInput = document.getElementById("introInput");

  let MY_USER_ID = null;

  function fmtDate(s){
    if(!s) return "";
    return String(s).replace("T"," ");
  }

  function escapeHtml(str){
    return (str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  async function loadMe(){
    const res = await apiFetch("/api/users/me");
    if(!res) return;

    const me = await res.json();

    MY_USER_ID = me.id ?? null;

    nicknameText.textContent = me.nickname || "-";
    emailText.textContent = me.email || "-";
    introText.textContent = me.intro ? me.intro : "소개가 없습니다.";

    nicknameInput.value = me.nickname || "";
    introInput.value = me.intro || "";
  }

  // userId 기반 링크 + 내 자신이면 mypage
  function cardHtml(p){
    const nickname = p.nickname || p.username || "USER";
    const userId = p.userId;

    const url = (MY_USER_ID && userId === MY_USER_ID)
      ? "/mypage.html"
      : "/user.html?userId=" + encodeURIComponent(userId);

    return `
      <article class="card">
        <div class="card-header">
          <div class="avatar"></div>
          <div class="meta">
            <div class="name">
              <a href="${url}" class="user-link" style="color:inherit; text-decoration:none; font-weight:800;">
                ${escapeHtml(nickname)}
              </a>
            </div>
            <div class="date">${escapeHtml(fmtDate(p.createdAt))}</div>
          </div>
        </div>
        <div class="card-body">
          <p class="title">${escapeHtml(p.title || "")}</p>
          <p class="content">${escapeHtml(p.content || "")}</p>
        </div>
        <div class="card-footer">
          <span>좋아요</span>
          <span>댓글</span>
        </div>
      </article>
    `;
  }

  async function loadMine(){
    const mineEl = document.getElementById("mine");
    const emptyEl = document.getElementById("emptyMine");
    mineEl.innerHTML = "";

    const res = await apiFetch("/api/boards/mine");
    if(!res) return;

    const list = await res.json();

    if(!list || list.length === 0){
      emptyEl.style.display = "block";
      return;
    }

    emptyEl.style.display = "none";
    mineEl.innerHTML = list.map(cardHtml).join("");
  }

  btnEdit.onclick = () => {
    editMsg.textContent = "";
    editBox.style.display = (editBox.style.display === "none") ? "block" : "none";
  };

  btnCancelEdit.onclick = () => {
    editMsg.textContent = "";
    editBox.style.display = "none";
    nicknameInput.value = nicknameText.textContent === "-" ? "" : nicknameText.textContent;
    introInput.value = (introText.textContent === "소개가 없습니다.") ? "" : introText.textContent;
  };

  btnSaveEdit.onclick = async () => {
    editMsg.textContent = "";

    const nickname = nicknameInput.value.trim();
    const intro = introInput.value.trim();

    if(!nickname){
      editMsg.textContent = "닉네임은 필수입니다.";
      return;
    }

    const res = await apiFetch("/api/users/me", {
      method: "PUT",
      body: JSON.stringify({ nickname, intro })
    });

    if(!res) return;

    if(!res.ok){
      const t = await res.text().catch(() => "");
      editMsg.textContent = "저장 실패: " + (t || res.status);
      return;
    }

    editBox.style.display = "none";
    await loadMe();
    await loadMine();
  };

  (async () => {
    await loadMe();
    await loadMine();
  })();
</script>
</body>
</html>
