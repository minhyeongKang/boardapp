<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoardApp - MyPage</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">BoardApp</div>
    <div class="actions">
      <button class="pill-btn" id="btnMain">메인</button>
      <button class="pill-btn" id="btnLogout">로그아웃</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="panel">
    <div class="page-title">마이페이지</div>

    <!-- 프로필 카드 -->
    <section class="card">
      <div class="profile">
        <div class="avatar"></div>

        <div class="profile-info">
          <div class="profile-top">
            <div>
              <p class="big" id="nicknameText">닉네임</p>
              <p class="small" id="emailText">이메일</p>
            </div>
            <button class="pill-btn" id="btnEdit">프로필 수정</button>
          </div>

          <p class="bio" id="introText">소개</p>

          <!-- 수정 폼 (기본 숨김) -->
          <div class="edit-box" id="editBox" style="display:none;">
            <div class="form-row">
              <label for="nicknameInput">닉네임</label>
              <input id="nicknameInput" class="auth-input" placeholder="닉네임" />
            </div>

            <div class="form-row">
              <label for="introInput">소개</label>
              <textarea id="introInput" class="auth-textarea" rows="3" placeholder="소개를 입력하세요"></textarea>
            </div>

            <div class="row-actions">
              <button class="pill-btn" id="btnCancelEdit">취소</button>
              <button class="primary-btn" id="btnSaveEdit">저장</button>
            </div>

            <p id="editMsg" class="auth-msg" style="margin-top:10px;"></p>
          </div>
        </div>
      </div>
    </section>

    <div style="height:14px;"></div>

    <!-- 내 게시글 -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div class="page-title" style="margin:0;">내 게시글</div>
      <button class="pill-btn" id="btnRefresh">새로고침</button>
    </div>

    <div id="mine" class="grid"></div>
    <div id="emptyMine" class="empty" style="display:none;">아직 작성한 게시글이 없습니다.</div>
  </div>
</main>

<script src="/js/auth.js"></script>
<script>
  // 토큰 없으면 index로
  requireAuth();

  document.getElementById("btnMain").onclick = () => location.href = "/main.html";
  document.getElementById("btnLogout").onclick = logout;
  document.getElementById("btnRefresh").onclick = loadMine;

  const btnEdit = document.getElementById("btnEdit");
  const editBox = document.getElementById("editBox");
  const btnCancelEdit = document.getElementById("btnCancelEdit");
  const btnSaveEdit = document.getElementById("btnSaveEdit");
  const editMsg = document.getElementById("editMsg");

  const nicknameText = document.getElementById("nicknameText");
  const emailText = document.getElementById("emailText");
  const introText = document.getElementById("introText");
  const nicknameInput = document.getElementById("nicknameInput");
  const introInput = document.getElementById("introInput");

  function fmtDate(s){
    if(!s) return "";
    return String(s).replace("T"," ");
  }

  function escapeHtml(str){
    return (str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function cardHtml(p){
    const name = p.authorNickname || p.nickname || p.username || "USER";
    return `
      <article class="card">
        <div class="card-header">
          <div class="avatar"></div>
          <div class="meta">
            <div class="name">${escapeHtml(name)}</div>
            <div class="date">${escapeHtml(fmtDate(p.createdAt))}</div>
          </div>
        </div>
        <div class="card-body">
          <p class="title">${escapeHtml(p.title || "")}</p>
          <p class="content">${escapeHtml(p.content || "")}</p>
        </div>
        <div class="card-footer">
          <span>좋아요</span>
          <span>댓글</span>
        </div>
      </article>
    `;
  }

  async function loadMe(){
    const res = await apiFetch("/api/users/me");
    if(!res) return; // ✅ null 체크 (401/403이면 auth.js가 리다이렉트 처리)

    const me = await res.json();

    // ✅ 매핑 정리 (소개글 intro)
    const nickname = me.nickname ?? me.name ?? me.username ?? "닉네임";
    const email = me.email ?? ""; // me.username는 아이디라 이메일이 아님
    const intro = me.intro ?? me.bio ?? "";

    nicknameText.textContent = nickname;
    emailText.textContent = email || "(이메일 없음)";
    introText.textContent = intro ? intro : "소개가 없습니다.";

    // 수정 폼 초기값
    nicknameInput.value = nickname || "";
    introInput.value = intro || "";
  }

  async function loadMine(){
    const mineEl = document.getElementById("mine");
    const emptyEl = document.getElementById("emptyMine");
    mineEl.innerHTML = "";

    const res = await apiFetch("/api/boards/mine");
    if(!res) return; // ✅ null 체크

    const list = await res.json();

    if(!list || list.length === 0){
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";
    mineEl.innerHTML = list.map(cardHtml).join("");
  }

  // 프로필 수정 열기/닫기
  btnEdit.onclick = () => {
    editMsg.textContent = "";
    editBox.style.display = (editBox.style.display === "none") ? "block" : "none";
  };

  btnCancelEdit.onclick = () => {
    editMsg.textContent = "";
    editBox.style.display = "none";
    // 원래 값으로 되돌리기
    nicknameInput.value = nicknameText.textContent || "";
    introInput.value = (introText.textContent === "소개가 없습니다.") ? "" : introText.textContent;
  };

  // ✅ 닉네임/소개 저장
  btnSaveEdit.onclick = async () => {
    editMsg.textContent = "";

    const nickname = nicknameInput.value.trim();
    const intro = introInput.value.trim();

    if(!nickname){
      editMsg.textContent = "닉네임은 비워둘 수 없습니다.";
      return;
    }

    const res = await apiFetch("/api/users/me", {
      method: "PUT",
      body: JSON.stringify({ nickname, intro })
    });

    if(!res) return; // 401/403 처리

    if(!res.ok){
      const t = await res.text();
      editMsg.textContent = "저장 실패: " + (t || res.status);
      return;
    }

    editBox.style.display = "none";
    await loadMe();
  };

  (async () => {
    await loadMe();
    await loadMine();
  })();
</script>
</body>
</html>
