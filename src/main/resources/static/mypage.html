<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoardApp • MyPage</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="app-body">
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="location.href='/main.html'" style="cursor:pointer;">BoardApp</div>
    <div class="topbar-actions">
      <button class="iconbtn" type="button" onclick="location.href='/main.html'">
        <span class="icon">⌂</span>
      </button>
      <button class="iconbtn" type="button" onclick="logout()">
        <span class="icon">↩</span>
      </button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="feed">
    <article class="post">
      <div class="post-header">
        <div class="avatar"></div>
        <div class="post-meta">
          <div class="post-user" id="mp_username">username</div>
          <div class="post-time" id="mp_email">email</div>
        </div>
      </div>

      <div class="post-body">
        <div class="post-stats">프로필</div>

        <div style="padding: 4px 0 8px;">
          <div style="font-size:12px;color:#8e8e8e;margin-bottom:6px;">닉네임</div>
          <input id="mp_nickname" class="auth-input" style="margin:0;" />
        </div>

        <div style="padding: 10px 0 8px;">
          <div style="font-size:12px;color:#8e8e8e;margin-bottom:6px;">소개글</div>
          <textarea id="mp_intro" class="auth-input auth-textarea" style="margin:0;"></textarea>
        </div>

        <button class="auth-button" type="button" onclick="saveProfile()">
          저장
        </button>

        <p id="mp_result" class="auth-message" style="color:#8e8e8e;"></p>
      </div>
    </article>
  </section>

  <aside class="sidebar">
    <div class="side-card">
      <div class="side-title">메뉴</div>
      <div class="suggest">
        <div class="suggest-row">
          <div class="avatar small"></div>
          <div class="suggest-info">
            <div class="suggest-name">마이페이지</div>
            <div class="suggest-sub">프로필 수정</div>
          </div>
          <button class="textbtn" type="button" onclick="location.href='/mypage.html'">이동</button>
        </div>

        <div class="suggest-row">
          <div class="avatar small"></div>
          <div class="suggest-info">
            <div class="suggest-name">메인</div>
            <div class="suggest-sub">피드 보기</div>
          </div>
          <button class="textbtn" type="button" onclick="location.href='/main.html'">이동</button>
        </div>
      </div>
    </div>
  </aside>
</main>

<script>
  const TOKEN_KEY = "boardapp_token";

  function getToken() {
    return localStorage.getItem(TOKEN_KEY);
  }

  function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
  }

  function ensureAuth() {
    const token = getToken();
    if (!token) {
      location.href = "/";
      return null;
    }
    return token;
  }

  function logout() {
    clearToken();
    location.href = "/";
  }

  async function fetchMe() {
    const token = ensureAuth();
    if (!token) return;

    const res = await fetch("/api/users/me", {
      method: "GET",
      headers: { "Authorization": `Bearer ${token}` }
    });

    if (!res.ok) {
      clearToken();
      location.href = "/";
      return;
    }

    const me = await res.json();

    document.getElementById("mp_username").textContent = me.username ?? "";
    document.getElementById("mp_email").textContent = me.email ?? "";
    document.getElementById("mp_nickname").value = me.nickname ?? "";
    document.getElementById("mp_intro").value = me.intro ?? "";
  }

  async function saveProfile() {
    const token = ensureAuth();
    if (!token) return;

    const payload = {
      nickname: document.getElementById("mp_nickname").value.trim(),
      intro: document.getElementById("mp_intro").value.trim()
    };

    const el = document.getElementById("mp_result");
    el.textContent = "";

    try {
      const res = await fetch("/api/users/me", {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        el.textContent = "저장 실패";
        return;
      }

      el.textContent = "저장 완료";
    } catch {
      el.textContent = "서버와 통신할 수 없습니다.";
    }
  }

  fetchMe();
</script>
</body>
</html>
