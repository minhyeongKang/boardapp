<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoardApp - MyPage</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">BoardApp</div>

    <div class="icon-actions">
      <button class="icon-action" id="btnMain" title="메인" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M3 11.5L12 4l9 7.5"></path>
          <path d="M6 10.5V20h12v-9.5"></path>
          <path d="M10 20v-6h4v6"></path>
        </svg>
      </button>

      <button class="icon-action" id="btnWrite" title="새 글 작성" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>

      <button class="icon-action" id="btnLogout" title="로그아웃" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="container">
  <div class="panel">
    <div class="page-title">마이페이지</div>

    <section class="card">
      <div class="profile">
        <div class="avatar"></div>

        <div class="profile-info" style="width:100%;">
          <div style="display:flex; justify-content:space-between;">
            <div>
              <p class="big" id="nicknameText"></p>
              <p class="small" id="emailText"></p>
            </div>
            <button class="pill-btn" id="btnEdit" type="button">프로필 수정</button>
          </div>

          <p class="bio" id="introText"></p>

          <div id="editBox" style="display:none; margin-top:12px;">
            <div class="form-row">
              <label>닉네임</label>
              <input id="nicknameInput"/>
            </div>

            <div class="form-row">
              <label>소개</label>
              <textarea id="introInput"></textarea>
            </div>

            <div class="row-actions">
              <button class="pill-btn" id="btnCancelEdit" type="button">취소</button>
              <button class="primary-btn" id="btnSaveEdit" type="button">저장</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div style="margin-top:18px;">
      <div class="page-title">내 게시글</div>
      <div id="mine" class="grid"></div>
    </div>
  </div>
</main>

<script src="/js/auth.js"></script>
<script>
  requireAuth();

  const btnMain = document.getElementById("btnMain");
  const btnWrite = document.getElementById("btnWrite");
  const btnLogout = document.getElementById("btnLogout");

  btnMain.onclick = () => location.href = "/main.html";
  btnWrite.onclick = () => location.href = "/write.html";
  btnLogout.onclick = logout;

  const btnEdit = document.getElementById("btnEdit");
  const btnCancelEdit = document.getElementById("btnCancelEdit");
  const btnSaveEdit = document.getElementById("btnSaveEdit");
  const editBox = document.getElementById("editBox");

  const nicknameText = document.getElementById("nicknameText");
  const emailText = document.getElementById("emailText");
  const introText = document.getElementById("introText");

  const nicknameInput = document.getElementById("nicknameInput");
  const introInput = document.getElementById("introInput");
  const mineEl = document.getElementById("mine");

  function escapeHtml(str){
    return (str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmtDate(s){
    return s ? String(s).replace("T"," ") : "";
  }

  // 메뉴 토글/닫기
  function toggleMenu(e, boardId) {
    e.stopPropagation();

    document.querySelectorAll(".card-menu").forEach(m => {
      if (m.id !== "menu-" + boardId) m.style.display = "none";
    });

    const menu = document.getElementById("menu-" + boardId);
    if (!menu) return;

    menu.style.display = (menu.style.display === "block") ? "none" : "block";
  }

  document.addEventListener("click", () => {
    document.querySelectorAll(".card-menu").forEach(m => m.style.display = "none");
  });

  async function loadMe(){
    const res = await apiFetch("/api/users/me");
    if(!res) return;
    const me = await res.json();

    nicknameText.textContent = me.nickname;
    emailText.textContent = me.email;
    introText.textContent = me.intro || "소개가 없습니다.";

    nicknameInput.value = me.nickname;
    introInput.value = me.intro || "";
  }

  function cardHtml(p){
    const editUrl = "/edit.html?boardId=" + encodeURIComponent(p.id);

    return `
      <article class="card">
        <div class="card-header" style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div style="display:flex; gap:12px; align-items:center;">
            <div class="avatar"></div>
            <div class="meta">
              <div class="name">${escapeHtml(p.nickname || "USER")}</div>
              <div class="date">${escapeHtml(fmtDate(p.createdAt))}</div>
            </div>
          </div>

          <div style="position:relative;">
            <button type="button"
                    class="more-btn"
                    onclick="toggleMenu(event, ${p.id})"
                    title="더보기"
                    aria-label="더보기">⋮</button>

            <div id="menu-${p.id}" class="card-menu"
                 style="display:none; position:absolute; right:0; top:32px;
                        background:#fff; border:1px solid var(--line);
                        border-radius:12px; box-shadow:var(--shadow);
                        overflow:hidden; z-index:10; min-width:120px;">
              <button type="button"
                      style="padding:10px 14px; width:100%; border:0; background:none;
                             text-align:left; font-weight:700; cursor:pointer;"
                      onclick="location.href='${editUrl}'">수정</button>
            </div>
          </div>
        </div>

        <div class="card-body">
          <p class="title">${escapeHtml(p.title)}</p>
          <p class="content">${escapeHtml(p.content)}</p>
        </div>

        <div class="card-footer">
          <span>좋아요</span>
          <span>댓글</span>
        </div>
      </article>
    `;
  }

  async function loadMine(){
    const res = await apiFetch("/api/boards/mine");
    if(!res) return;
    const list = await res.json();
    mineEl.innerHTML = list.map(cardHtml).join("");
  }

  btnEdit.onclick = () => editBox.style.display = "block";
  btnCancelEdit.onclick = () => editBox.style.display = "none";

  btnSaveEdit.onclick = async () => {
    const res = await apiFetch("/api/users/me", {
      method:"PUT",
      body:JSON.stringify({
        nickname: nicknameInput.value,
        intro: introInput.value
      })
    });
    if(!res) return;

    editBox.style.display = "none";
    await loadMe();
  };

  loadMe();
  loadMine();

  // inline onclick에서 사용
  window.toggleMenu = toggleMenu;
</script>
</body>
</html>
