<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoardApp - Signup</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="auth-body">
<main class="auth-wrap">
  <section class="auth-card">
    <div class="auth-logo">BoardApp</div>
    <p class="auth-desc">친구들의 게시글을 확인하고 공유해보세요.</p>

    <form id="signupForm" class="auth-form">
      <!-- 서버 User 엔티티에 맞춰 전송: username, password, nickname, email, intro -->
      <input id="email" class="auth-input" type="email" placeholder="이메일" autocomplete="email" required />
      <input id="username" class="auth-input" type="text" placeholder="이름" autocomplete="username" required />
      <input id="nickname" class="auth-input" type="text" placeholder="닉네임" required />
      <input id="password" class="auth-input" type="password" placeholder="비밀번호" autocomplete="new-password" required />
      <textarea id="intro" class="auth-textarea" placeholder="소개글" rows="3"></textarea>

      <button class="auth-btn" type="submit">가입하기</button>

      <p id="msg" class="auth-msg"></p>
    </form>
  </section>

  <section class="auth-card auth-card--sub">
    <p class="auth-subtext">
      이미 계정이 있으신가요?
      <a class="auth-link" href="/index.html">로그인</a>
    </p>
  </section>

  <footer class="auth-footer">
    <small>© BoardApp</small>
  </footer>
</main>

<script>
  const form = document.getElementById("signupForm");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";

    const email = document.getElementById("email").value.trim();
    const username = document.getElementById("username").value.trim();
    const nickname = document.getElementById("nickname").value.trim();
    const password = document.getElementById("password").value.trim();
    const intro = document.getElementById("intro").value.trim();

    if (!email || !username || !nickname || !password) {
      msg.textContent = "필수 항목을 모두 입력해주세요.";
      return;
    }

    try {
      const res = await fetch("/api/users/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, username, nickname, password, intro }),
      });

      const text = await res.text();
      if (!res.ok) {
        msg.textContent = "회원가입 실패: " + (text || res.status);
        return;
      }

      // 성공
      alert(text || "회원가입 성공");
      location.href = "/index.html";
    } catch (err) {
      msg.textContent = "회원가입 오류: " + err;
    }
  });
</script>
</body>
</html>
