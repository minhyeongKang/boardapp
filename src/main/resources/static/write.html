<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BoardApp - Write</title>
    <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">BoardApp</div>
        <div class="actions">
            <button class="icon-action" id="btnBack" title="돌아가기" type="button">
                <svg viewBox="0 0 24 24">
                    <polyline points="15 18 9 12 15 6"></polyline>
                    <line x1="9" y1="12" x2="21" y2="12"></line>
                </svg>
            </button>
        </div>
    </div>
</header>

<main class="container">
    <div class="panel">
        <div class="card form-card">
            <div class="section-title">게시글 작성</div>

            <div class="form-row">
                <label for="title">제목</label>
                <input id="title" placeholder="제목을 입력하세요" />
            </div>

            <div class="form-row">
                <label for="content">내용</label>
                <textarea id="content" placeholder="내용을 입력하세요"></textarea>
            </div>

            <div class="row-actions">
                <button class="pill-btn" id="btnCancel" type="button">취소</button>
                <button class="primary-btn" id="btnSubmit" type="button">등록</button>
            </div>

            <p id="msg" class="muted" style="margin:12px 0 0;"></p>
        </div>
    </div>
</main>

<script src="/js/auth.js"></script>
<script>
    if (!requireAuth()) {
      // 토큰 없으면 index로 이동되므로 종료
    } else {
      document.getElementById("btnBack").onclick = () => location.href = "/main.html";
      document.getElementById("btnCancel").onclick = () => location.href = "/main.html";

      document.getElementById("btnSubmit").onclick = async () => {
        const title = document.getElementById("title").value.trim();
        const content = document.getElementById("content").value.trim();
        const msg = document.getElementById("msg");

        if(!title || !content){
          msg.textContent = "제목과 내용을 모두 입력해주세요.";
          return;
        }

        const res = await apiFetch("/api/boards", {
          method:"POST",
          body: JSON.stringify({ title, content })
        });

        if(!res) return; // ✅ null 체크 (401/403이면 apiFetch가 null)

        if(res.ok){
          location.href = "/main.html";
        }else{
          const t = await res.text();
          msg.textContent = "등록 실패: " + t;
        }
      };
    }
</script>
</body>
</html>
