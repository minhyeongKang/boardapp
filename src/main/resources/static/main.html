<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoardApp - Main</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">BoardApp</div>
    <div class="actions">
      <button class="icon-btn" id="btnWrite" type="button" title="글쓰기">+</button>
      <button class="icon-btn" id="btnMy" type="button" title="마이페이지">👤</button>
      <button class="icon-btn" id="btnLogout" type="button" title="로그아웃">↩</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="panel">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div class="page-title">전체 게시글</div>
      <button class="pill-btn" id="btnRefresh" type="button">새로고침</button>
    </div>

    <div id="feed" class="grid"></div>
    <div id="empty" class="empty" style="display:none;">아직 게시글이 없습니다. + 버튼으로 첫 글을 작성해보세요.</div>
  </div>
</main>

<script src="/js/auth.js"></script>
<script>
  if (!requireAuth()) {
    // 토큰 없으면 이미 index.html로 보내니까 여기서 종료
  } else {
    document.getElementById("btnWrite").onclick = () => location.href = "/write.html";
    document.getElementById("btnMy").onclick = () => location.href = "/mypage.html";
    document.getElementById("btnLogout").onclick = () => logout();
    document.getElementById("btnRefresh").onclick = () => loadFeed();

    function fmtDate(s){
      if(!s) return "";
      return String(s).replace("T"," ");
    }

    function escapeHtml(str){
      return (str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function cardHtml(p){
      const name = p.authorNickname || p.nickname || p.username || "USER";
      return `
        <article class="card">
          <div class="card-header">
            <div class="avatar"></div>
            <div class="meta">
              <div class="name">${escapeHtml(name)}</div>
              <div class="date">${escapeHtml(fmtDate(p.createdAt))}</div>
            </div>
          </div>
          <div class="card-body">
            <p class="title">${escapeHtml(p.title || "")}</p>
            <p class="content">${escapeHtml(p.content || "")}</p>
          </div>
          <div class="card-footer">
            <span>좋아요</span>
            <span>댓글</span>
          </div>
        </article>
      `;
    }

    async function loadFeed(){
      const feedEl = document.getElementById("feed");
      const emptyEl = document.getElementById("empty");
      feedEl.innerHTML = "";

      const res = await apiFetch("/api/boards");
      if(!res) return; // ✅ null 체크

      const list = await res.json();

      if(!list || list.length === 0){
        emptyEl.style.display = "block";
        return;
      }
      emptyEl.style.display = "none";
      feedEl.innerHTML = list.map(cardHtml).join("");
    }

    loadFeed();
  }
</script>
</body>
</html>
