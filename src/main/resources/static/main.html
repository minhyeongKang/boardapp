<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoardApp - Main</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">BoardApp</div>

    <div class="icon-actions">
      <button class="icon-action" id="btnWrite" title="새 글 작성" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>

      <button class="icon-action" id="btnMy" title="마이페이지" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>

      <button class="icon-action" id="btnLogout" title="로그아웃" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="container">
  <div class="panel">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div class="page-title">전체 게시글</div>
      <button class="pill-btn" id="btnRefresh" type="button">새로고침</button>
    </div>

    <div id="feed" class="grid"></div>
    <div id="empty" class="empty" style="display:none;">아직 게시글이 없습니다.</div>
  </div>
</main>

<script src="/js/auth.js"></script>
<script>
  requireAuth();

  const btnWrite = document.getElementById("btnWrite");
  const btnMy = document.getElementById("btnMy");
  const btnLogout = document.getElementById("btnLogout");
  const btnRefresh = document.getElementById("btnRefresh");

  btnWrite.onclick = () => location.href = "/write.html";
  btnMy.onclick = () => location.href = "/mypage.html";
  btnLogout.onclick = logout;
  btnRefresh.onclick = loadFeed;

  let MY_USER_ID = null;

  // 게시글(boardId)별로 지금 수정 중인 댓글 id를 저장하는 곳
  // 예: editingCommentId[1] = 123  (1번 게시글에서 123번 댓글 수정 중)
  const editingCommentId = {};


  function fmtDate(s){
    if(!s) return "";
    return String(s).replace("T"," ");
  }

  function escapeHtml(str){
    return (str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  async function loadMyContext(){
    const res = await apiFetch("/api/users/me");
    if(!res) return;
    const me = await res.json();
    MY_USER_ID = me.id ?? null;
  }

  // 메뉴 토글/닫기
  function toggleMenu(e, boardId) {
    e.stopPropagation();

    document.querySelectorAll(".card-menu").forEach(m => {
      if (m.id !== "menu-" + boardId) m.style.display = "none";
    });

    const menu = document.getElementById("menu-" + boardId);
    if (!menu) return;

    menu.style.display = (menu.style.display === "block") ? "none" : "block";
  }

  document.addEventListener("click", () => {
    document.querySelectorAll(".card-menu").forEach(m => m.style.display = "none");
  });

  function cardHtml(p){
    const nickname = p.nickname || p.username || "USER";
    const userId = p.userId;

    const profileUrl = (MY_USER_ID && userId === MY_USER_ID)
      ? "/mypage.html"
      : "/user.html?userId=" + encodeURIComponent(userId);

    const isMine = (MY_USER_ID && userId === MY_USER_ID);
    const editUrl = "/edit.html?boardId=" + encodeURIComponent(p.id);

    const moreHtml = isMine ? `
      <div class="more-wrap" style="position:relative;">
        <button type="button"
                class="more-btn"
                onclick="toggleMenu(event, ${p.id})"
                title="더보기"
                aria-label="더보기">⋮</button>

        <div id="menu-${p.id}" class="card-menu"
             style="display:none; position:absolute; right:0; top:32px;
                    background:#fff; border:1px solid var(--line);
                    border-radius:12px; box-shadow:var(--shadow);
                    overflow:hidden; z-index:10; min-width:120px;">
          <button type="button"
                  style="padding:10px 14px; width:100%; border:0; background:none;
                         text-align:left; font-weight:700; cursor:pointer;"
                  onclick="location.href='${editUrl}'">수정</button>
        </div>
      </div>
    ` : `<div style="width:28px;height:28px;"></div>`;

    return `
      <article class="card">
        <div class="card-header" style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div style="display:flex; gap:12px; align-items:center;">
            <div class="avatar"></div>
            <div class="meta">
              <div class="name">
                <a href="${profileUrl}" class="user-link" style="color:inherit; text-decoration:none; font-weight:800;">
                  ${escapeHtml(nickname)}
                </a>
              </div>
              <div class="date">${escapeHtml(fmtDate(p.createdAt))}</div>
            </div>
          </div>
          ${moreHtml}
        </div>

        <div class="card-body">
          <p class="title">${escapeHtml(p.title || "")}</p>
          <p class="content">${escapeHtml(p.content || "")}</p>
        </div>

        <div class="comments" id="comments-${p.id}">
          <div class="comment-list" id="commentList-${p.id}">댓글 불러오는 중...</div>

          <div class="comment-form">
              <input type="text" class="input" id="commentInput-${p.id}" placeholder="댓글을 입력하세요" />

              <button class="pill-btn" id="commentSubmit-${p.id}" onclick="submitComment(${p.id})">등록</button>

              <button class="pill-btn" id="commentCancel-${p.id}" onclick="cancelEdit(${p.id})" style="display:none;">취소</button>
           </div>
        </div>



        <div class="card-footer">
          <span>좋아요</span>
          <span>댓글</span>
        </div>
      </article>
    `;
  }

  async function loadFeed(){
    const feedEl = document.getElementById("feed");
    const emptyEl = document.getElementById("empty");
    feedEl.innerHTML = "";

    const res = await apiFetch("/api/boards");
    if(!res) return;

    const list = await res.json();
    if(!list || list.length === 0){
      emptyEl.style.display = "block";
      return;
    }

    emptyEl.style.display = "none";
    feedEl.innerHTML = list.map(cardHtml).join("");
    // 게시글 카드가 그려진 다음, 각 게시글의 댓글을 불러온다
    list.forEach(p => loadComments(p.id));

  }

  (async () => {
    await loadMyContext();
    await loadFeed();
  })();

    async function loadComments(boardId){
    const el = document.getElementById(`commentList-${boardId}`);
    if(!el) return;

    const res = await apiFetch(`/api/boards/${boardId}/comments`);
    if(!res) return;

    const list = await res.json();
    if(!list || list.length === 0){
      el.innerHTML = `<div class="muted">아직 댓글이 없어요</div>`;
      return;
    }

    el.innerHTML = list.map(c => {
  const mine = (MY_USER_ID && c.userId === MY_USER_ID);
  return `
    <div class="comment-item" id="comment-${c.id}">
      <div class="comment-top">
        <b>${escapeHtml(c.nickname || "USER")}</b>
        <span class="muted">${fmtDate(c.createdAt)}</span>
      </div>

      <div class="comment-content" id="comment-content-${c.id}">
        ${escapeHtml(c.content || "")}
      </div>

      ${mine ? `
        <button class="mini-btn"
                onclick="startInlineEdit(${c.id}, ${boardId}, '${encodeURIComponent(c.content || "")}')">수정</button>
        <button class="mini-btn"
                onclick="deleteComment(${c.id}, ${boardId})">삭제</button>
      ` : ``}
    </div>
  `;
  }).join("");

  }

  async function submitComment(boardId){
    const input = document.getElementById(`commentInput-${boardId}`);
    if(!input) return;

    const content = (input.value || "").trim();
    if(!content){
      alert("댓글 내용을 입력하세요!");
      return;
    }

    // 지금 이 게시글이 "수정 모드"인지 확인
    const commentId = editingCommentId[boardId];

    // 1) 수정 모드라면 → PUT 요청
    if (commentId) {
        const res = await apiFetch(`/api/comments/${commentId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content })
        });
    if(!res) return;

    // 수정 끝났으니 원상복구
    cancelEdit(boardId);
    await loadComments(boardId);
    return;
    }

    const res = await apiFetch(`/api/boards/${boardId}/comments`, {
      method: "POST",
      body: JSON.stringify({ content })
    });
    if(!res) return;

    input.value = "";
    await loadComments(boardId);
  }
  // 지금 어떤 댓글이 편집 중인지 저장 (동시에 여러 개 열리는 것 방지)
  let editingInlineCommentId = null;

  // 댓글 자리에서 인라인 편집 시작
  function startInlineEdit(commentId, boardId, encodedContent) {
    // 이미 다른 댓글 수정 중이면 막기(원하면 허용으로 바꿀 수도 있음)
    if (editingInlineCommentId && editingInlineCommentId !== commentId) {
      alert("다른 댓글을 수정 중이에요. 먼저 저장 또는 취소해주세요.");
      return;
    }
  editingInlineCommentId = commentId;

  const contentEl = document.getElementById(`comment-content-${commentId}`);
  if (!contentEl) return;

  const currentContent = decodeURIComponent(encodedContent || "");

  // 원래 내용 백업(취소 누르면 되돌리기)
  contentEl.dataset.original = currentContent;

  // 댓글 내용을 input + 버튼으로 교체
  contentEl.innerHTML = `
    <div style="display:flex; gap:8px; align-items:center;">
      <input type="text"
             class="input"
             id="inline-input-${commentId}"
             value="${escapeHtml(currentContent)}"
             style="flex:1;" />
      <button class="mini-btn" onclick="saveInlineEdit(${commentId}, ${boardId})">저장</button>
      <button class="mini-btn" onclick="cancelInlineEdit(${commentId})">취소</button>
    </div>
  `;

  // 커서 자동 포커스
  const input = document.getElementById(`inline-input-${commentId}`);
  if (input) {
    input.focus();
    // 커서를 맨 뒤로
    input.setSelectionRange(input.value.length, input.value.length);
    }
  }

  // 인라인 편집 취소(원래 내용으로 복구)
  function cancelInlineEdit(commentId) {
    const contentEl = document.getElementById(`comment-content-${commentId}`);
    if (!contentEl) return;

  const original = contentEl.dataset.original || "";
  contentEl.innerHTML = escapeHtml(original);

  editingInlineCommentId = null;
  }

  // 인라인 편집 저장(PUT 요청)
  async function saveInlineEdit(commentId, boardId) {
  const input = document.getElementById(`inline-input-${commentId}`);
  if (!input) return;

  const newContent = (input.value || "").trim();
  if (!newContent) {
    alert("내용을 입력해주세요!");
    return;
  }

  const res = await apiFetch(`/api/comments/${commentId}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: newContent })
  });
  if (!res) return;

  // 저장 성공 → 편집 모드 종료 후, 댓글 목록 새로고침
  editingInlineCommentId = null;
  await loadComments(boardId);
  }


async function deleteComment(commentId, boardId){
    if(!confirm("댓글을 삭제할까요?")) return;

    const res = await apiFetch(`/api/comments/${commentId}`, { method: "DELETE" });
    if(!res) return;

    await loadComments(boardId);
  }


  // inline onclick에서 사용
  window.toggleMenu = toggleMenu;
  window.submitComment = submitComment;
  window.deleteComment = deleteComment;
  window.startInlineEdit = startInlineEdit;
  window.cancelInlineEdit = cancelInlineEdit;
  window.saveInlineEdit = saveInlineEdit;

</script>
</body>
</html>
