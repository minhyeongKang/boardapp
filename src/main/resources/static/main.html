<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoardApp - Main</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">BoardApp</div>
    <div class="actions">
      <button class="icon-btn" id="btnWrite" type="button" title="글쓰기">+</button>
      <button class="icon-btn" id="btnMy" type="button" title="마이페이지">👤</button>
      <button class="icon-btn" id="btnLogout" type="button" title="로그아웃">↩</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="panel">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div class="page-title">전체 게시글</div>
      <button class="pill-btn" id="btnRefresh" type="button">새로고침</button>
    </div>

    <div id="feed" class="grid"></div>
    <div id="empty" class="empty" style="display:none;">
      아직 게시글이 없습니다. + 버튼으로 첫 글을 작성해보세요.
    </div>
  </div>
</main>

<script src="/js/auth.js"></script>
<script>
  requireAuth();

  document.getElementById("btnWrite").onclick = () => location.href = "/write.html";
  document.getElementById("btnMy").onclick = () => location.href = "/mypage.html";
  document.getElementById("btnLogout").onclick = logout;
  document.getElementById("btnRefresh").onclick = loadFeed;

  let MY_USER_ID = null;

  function fmtDate(s){
    if(!s) return "";
    return String(s).replace("T"," ");
  }

  function escapeHtml(str){
    return (str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  async function loadMyContext(){
    const res = await apiFetch("/api/users/me");
    if(!res) return;
    const me = await res.json();
    MY_USER_ID = me.id ?? null;
  }

  // userId 기반 링크 + 내 자신 클릭 시 mypage
  function cardHtml(p){
    const nickname = p.nickname || p.username || "USER";
    const userId = p.userId;

    const url = (MY_USER_ID && userId === MY_USER_ID)
      ? "/mypage.html"
      : "/user.html?userId=" + encodeURIComponent(userId);

    return `
      <article class="card">
        <div class="card-header">
          <div class="avatar"></div>
          <div class="meta">
            <div class="name">
              <a href="${url}" class="user-link" style="color:inherit; text-decoration:none; font-weight:800;">
                ${escapeHtml(nickname)}
              </a>
            </div>
            <div class="date">${escapeHtml(fmtDate(p.createdAt))}</div>
          </div>
        </div>
        <div class="card-body">
          <p class="title">${escapeHtml(p.title || "")}</p>
          <p class="content">${escapeHtml(p.content || "")}</p>
        </div>
        <div class="card-footer">
          <span>좋아요</span>
          <span>댓글</span>
        </div>
      </article>
    `;
  }

  async function loadFeed(){
    const feedEl = document.getElementById("feed");
    const emptyEl = document.getElementById("empty");
    feedEl.innerHTML = "";

    const res = await apiFetch("/api/boards");
    if(!res) return;

    const list = await res.json();

    if(!list || list.length === 0){
      emptyEl.style.display = "block";
      return;
    }

    emptyEl.style.display = "none";
    feedEl.innerHTML = list.map(cardHtml).join("");
  }

  (async () => {
    await loadMyContext();
    await loadFeed();
  })();
</script>
</body>
</html>
