<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoardApp - Main</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">BoardApp</div>

    <div class="icon-actions">
      <button class="icon-action" id="btnWrite" title="새 글 작성" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>

      <button class="icon-action" id="btnMy" title="마이페이지" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>

      <button class="icon-action" id="btnLogout" title="로그아웃" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="container">
  <div class="panel">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div class="page-title">전체 게시글</div>
      <button class="pill-btn" id="btnRefresh" type="button">새로고침</button>
    </div>

    <div id="feed" class="grid"></div>
    <div id="empty" class="empty" style="display:none;">아직 게시글이 없습니다.</div>
  </div>
</main>

<script src="/js/auth.js"></script>
<script>
  requireAuth();

  const btnWrite = document.getElementById("btnWrite");
  const btnMy = document.getElementById("btnMy");
  const btnLogout = document.getElementById("btnLogout");
  const btnRefresh = document.getElementById("btnRefresh");

  btnWrite.onclick = () => location.href = "/write.html";
  btnMy.onclick = () => location.href = "/mypage.html";
  btnLogout.onclick = logout;
  btnRefresh.onclick = loadFeed;

  let MY_USER_ID = null;
  let editingInlineCommentId = null;

  function fmtDate(s){
    if(!s) return "";
    return String(s).replace("T"," ");
  }

  function escapeHtml(str){
    return (str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  async function loadMyContext(){
    const res = await apiFetch("/api/users/me");
    if(!res) return;
    const me = await res.json();
    MY_USER_ID = me.id ?? null;
  }

  function togglePostMenu(e, boardId) {
    e.stopPropagation();

    document.querySelectorAll(".card-menu").forEach(m => {
      if (m.id !== "menu-" + boardId) m.style.display = "none";
    });

    const menu = document.getElementById("menu-" + boardId);
    if (!menu) return;

    menu.style.display = (menu.style.display === "block") ? "none" : "block";
  }

  function toggleCommentMenu(e, commentId) {
    e.stopPropagation();

    document.querySelectorAll(".comment-menu").forEach(m => {
      if (m.id !== "c-menu-" + commentId) m.style.display = "none";
    });

    const menu = document.getElementById("c-menu-" + commentId);
    if (!menu) return;

    menu.style.display = (menu.style.display === "block") ? "none" : "block";
  }

  document.addEventListener("click", () => {
    document.querySelectorAll(".card-menu").forEach(m => m.style.display = "none");
    document.querySelectorAll(".comment-menu").forEach(m => m.style.display = "none");
  });

  async function toggleComments(boardId){
    const wrap = document.getElementById(`comments-${boardId}`);
    if(!wrap) return;

    // 한 번에 하나만 열리게
    document.querySelectorAll(".comments").forEach(x => {
      if (x.id !== `comments-${boardId}`) x.style.display = "none";
    });

    const hidden = (wrap.style.display === "" || wrap.style.display === "none");
    if (hidden) {
      wrap.style.display = "block";
      await loadComments(boardId);
    } else {
      wrap.style.display = "none";
    }
  }

  // 게시글 삭제
  async function deleteBoard(boardId){
    if(!confirm("게시글을 삭제할까요?")) return;

    const res = await apiFetch(`/api/boards/${boardId}`, { method: "DELETE" });
    if(!res) return;

    await loadFeed();
  }

  function cardHtml(p){
    const nickname = p.nickname || p.username || "USER";
    const userId = p.userId;

    const profileUrl = (MY_USER_ID && userId === MY_USER_ID)
      ? "/mypage.html"
      : "/user.html?userId=" + encodeURIComponent(userId);

    const isMine = (MY_USER_ID && userId === MY_USER_ID);
    const editUrl = "/edit.html?boardId=" + encodeURIComponent(p.id);

    const postMenuHtml = isMine ? `
      <div style="position:relative;">
        <button type="button" class="more-btn" onclick="togglePostMenu(event, ${p.id})" title="더보기">⋮</button>
        <div id="menu-${p.id}" class="card-menu">
          <button type="button" class="menu-item" onclick="location.href='${editUrl}'">수정</button>
          <button type="button" class="menu-item" style="color:#dc2626;" onclick="deleteBoard(${p.id})">삭제</button>
        </div>
      </div>
    ` : `<div style="width:28px;height:28px;"></div>`;

    return `
      <article class="card">
        <div class="card-header" style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div style="display:flex; gap:12px; align-items:center;">
            <div class="avatar"></div>
            <div class="meta">
              <div class="name">
                <a href="${profileUrl}" class="user-link" style="font-weight:800;">
                  ${escapeHtml(nickname)}
                </a>
              </div>
              <div class="date">${escapeHtml(fmtDate(p.createdAt))}</div>
            </div>
          </div>
          ${postMenuHtml}
        </div>

        <div class="card-body">
          <p class="title">${escapeHtml(p.title || "")}</p>
          <p class="content">${escapeHtml(p.content || "")}</p>
        </div>

        <div class="ig-actions">
          <button class="ig-action-btn" type="button" title="좋아요"
                  onclick="alert('좋아요는 다음 단계로 구현할게요')">
            <svg viewBox="0 0 24 24">
              <path d="M20.8 4.6c-1.7-1.7-4.5-1.7-6.2 0L12 7.2 9.4 4.6c-1.7-1.7-4.5-1.7-6.2 0s-1.7 4.5 0 6.2L12 20.6l8.8-8.8c1.7-1.7 1.7-4.5 0-6.2z"/>
            </svg>
          </button>

          <button class="ig-action-btn" type="button" title="댓글" onclick="toggleComments(${p.id})">
            <svg viewBox="0 0 24 24">
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
            </svg>
          </button>
        </div>

        <div class="comments" id="comments-${p.id}">
          <div class="comment-list" id="commentList-${p.id}">댓글 불러오는 중...</div>

          <div class="comment-form">
            <input type="text" class="input" id="commentInput-${p.id}" placeholder="댓글을 입력하세요" />
            <button class="pill-btn" type="button" onclick="submitComment(${p.id})">등록</button>
          </div>
        </div>
      </article>
    `;
  }

  async function loadFeed(){
    const feedEl = document.getElementById("feed");
    const emptyEl = document.getElementById("empty");
    feedEl.innerHTML = "";

    const res = await apiFetch("/api/boards");
    if(!res) return;

    const list = await res.json();
    if(!list || list.length === 0){
      emptyEl.style.display = "block";
      return;
    }

    emptyEl.style.display = "none";
    feedEl.innerHTML = list.map(cardHtml).join("");
  }

  async function loadComments(boardId){
    const el = document.getElementById(`commentList-${boardId}`);
    if(!el) return;

    const res = await apiFetch(`/api/boards/${boardId}/comments`);
    if(!res) return;

    const list = await res.json();
    if(!list || list.length === 0){
      el.innerHTML = `<div class="muted">아직 댓글이 없어요</div>`;
      return;
    }

    el.innerHTML = list.map(c => {
      const mine = (MY_USER_ID && c.userId === MY_USER_ID);

      const profileUrl = mine
        ? "/mypage.html"
        : "/user.html?userId=" + encodeURIComponent(c.userId);

      const menuHtml = mine ? `
        <div style="position:relative;">
          <button type="button"
                  class="more-btn"
                  onclick="toggleCommentMenu(event, ${c.id})"
                  title="더보기">⋮</button>
          <div id="c-menu-${c.id}" class="comment-menu">
            <button type="button" class="menu-item"
                    onclick="startInlineEdit(${c.id}, ${boardId}, '${encodeURIComponent(c.content || "")}')">수정</button>
            <button type="button" class="menu-item"
                    onclick="deleteComment(${c.id}, ${boardId})">삭제</button>
          </div>
        </div>
      ` : `<div style="width:28px;height:28px;"></div>`;

      return `
        <div class="comment-item" id="comment-${c.id}">
          <div class="comment-body">
            <div class="comment-top">
              <div style="display:flex; align-items:center; gap:8px;">
                <a href="${profileUrl}" class="user-link" style="font-weight:800;">
                  ${escapeHtml(c.nickname || "USER")}
                </a>
                <span class="muted">${escapeHtml(fmtDate(c.createdAt))}</span>
              </div>
              ${menuHtml}
            </div>

            <div class="comment-content" id="comment-content-${c.id}">
              ${escapeHtml(c.content || "")}
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  async function submitComment(boardId){
    const input = document.getElementById(`commentInput-${boardId}`);
    if(!input) return;

    const content = (input.value || "").trim();
    if(!content){
      alert("댓글 내용을 입력하세요!");
      return;
    }

    const res = await apiFetch(`/api/boards/${boardId}/comments`, {
      method: "POST",
      body: JSON.stringify({ content })
    });
    if(!res) return;

    input.value = "";
    await loadComments(boardId);
  }

  function startInlineEdit(commentId, boardId, encodedContent) {
    if (editingInlineCommentId && editingInlineCommentId !== commentId) {
      alert("다른 댓글을 수정 중이에요. 먼저 저장 또는 취소해주세요.");
      return;
    }
    editingInlineCommentId = commentId;

    const contentEl = document.getElementById(`comment-content-${commentId}`);
    if (!contentEl) return;

    const currentContent = decodeURIComponent(encodedContent || "");
    contentEl.dataset.original = currentContent;

    contentEl.innerHTML = `
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="text" class="input" id="inline-input-${commentId}"
               value="${escapeHtml(currentContent)}" style="flex:1;" />
        <button class="mini-btn" type="button" onclick="saveInlineEdit(${commentId}, ${boardId})">저장</button>
        <button class="mini-btn" type="button" onclick="cancelInlineEdit(${commentId})">취소</button>
      </div>
    `;
  }

  function cancelInlineEdit(commentId) {
    const contentEl = document.getElementById(`comment-content-${commentId}`);
    if (!contentEl) return;

    const original = contentEl.dataset.original || "";
    contentEl.innerHTML = escapeHtml(original);
    editingInlineCommentId = null;
  }

  async function saveInlineEdit(commentId, boardId) {
    const input = document.getElementById(`inline-input-${commentId}`);
    if (!input) return;

    const newContent = (input.value || "").trim();
    if (!newContent) {
      alert("내용을 입력해주세요!");
      return;
    }

    const res = await apiFetch(`/api/comments/${commentId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: newContent })
    });
    if (!res) return;

    editingInlineCommentId = null;
    await loadComments(boardId);
  }

  async function deleteComment(commentId, boardId){
    if(!confirm("댓글을 삭제할까요?")) return;

    const res = await apiFetch(`/api/comments/${commentId}`, { method: "DELETE" });
    if(!res) return;

    await loadComments(boardId);
  }

  (async () => {
    await loadMyContext();
    await loadFeed();
  })();

  window.togglePostMenu = togglePostMenu;
  window.toggleCommentMenu = toggleCommentMenu;
  window.toggleComments = toggleComments;
  window.submitComment = submitComment;
  window.startInlineEdit = startInlineEdit;
  window.cancelInlineEdit = cancelInlineEdit;
  window.saveInlineEdit = saveInlineEdit;
  window.deleteComment = deleteComment;
  window.deleteBoard = deleteBoard;
</script>
</body>
</html>
