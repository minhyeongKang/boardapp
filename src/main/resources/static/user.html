<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BoardApp - User</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">BoardApp</div>
    <div class="actions">
      <button class="pill-btn" id="btnMain" type="button">메인</button>
      <button class="pill-btn" id="btnMy" type="button">마이</button>
      <button class="pill-btn" id="btnLogout" type="button">로그아웃</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="panel">
    <div class="page-title">사용자 프로필</div>

    <section class="card">
      <div class="profile">
        <div class="avatar"></div>
        <div class="profile-info">
          <p class="big" id="uNickname">사용자 없음</p>
          <p class="small" id="uEmail"></p>
          <p class="bio" id="uIntro"></p>
        </div>
      </div>
    </section>

    <div style="height:14px;"></div>

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div class="page-title" style="margin:0;">게시글</div>
      <button class="pill-btn" id="btnRefresh" type="button">새로고침</button>
    </div>

    <div id="feed" class="grid"></div>
    <div id="empty" class="empty" style="display:none;">게시글이 없습니다.</div>
  </div>
</main>

<script src="/js/auth.js"></script>
<script>
  requireAuth();

  document.getElementById("btnMain").onclick = () => location.href = "/main.html";
  document.getElementById("btnMy").onclick = () => location.href = "/mypage.html";
  document.getElementById("btnLogout").onclick = logout;

  const params = new URLSearchParams(location.search);
  const userIdRaw = params.get("userId");
  const userId = userIdRaw ? Number(userIdRaw) : null;

  document.getElementById("btnRefresh").onclick = loadPosts;

  function fmtDate(s){
    if(!s) return "";
    return String(s).replace("T"," ");
  }

  function escapeHtml(str){
    return (str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function cardHtml(p){
    const nickname = p.nickname || p.username || "USER";
    return `
      <article class="card">
        <div class="card-header">
          <div class="avatar"></div>
          <div class="meta">
            <div class="name">${escapeHtml(nickname)}</div>
            <div class="date">${escapeHtml(fmtDate(p.createdAt))}</div>
          </div>
        </div>
        <div class="card-body">
          <p class="title">${escapeHtml(p.title || "")}</p>
          <p class="content">${escapeHtml(p.content || "")}</p>
        </div>
        <div class="card-footer">
          <span>좋아요</span>
          <span>댓글</span>
        </div>
      </article>
    `;
  }

  async function loadProfile(){
    if(!userId || Number.isNaN(userId)){
      document.getElementById("uNickname").textContent = "사용자 없음";
      document.getElementById("uEmail").textContent = "";
      document.getElementById("uIntro").textContent = "";
      return;
    }

    const res = await apiFetch("/api/users/profile/id/" + encodeURIComponent(userId));
    if(!res) return;

    if(!res.ok){
      const t = await res.text().catch(() => "");
      document.getElementById("uNickname").textContent = "사용자 없음";
      document.getElementById("uEmail").textContent = "";
      document.getElementById("uIntro").textContent = "조회 실패: " + (t || res.status);
      return;
    }

    const u = await res.json();

    document.getElementById("uNickname").textContent = u.nickname || "-";
    document.getElementById("uEmail").textContent = u.email || "(이메일 비공개)";
    document.getElementById("uIntro").textContent = u.intro || "소개가 없습니다.";
  }

  async function loadPosts(){
    const feedEl = document.getElementById("feed");
    const emptyEl = document.getElementById("empty");
    feedEl.innerHTML = "";

    if(!userId || Number.isNaN(userId)){
      emptyEl.style.display = "block";
      return;
    }

    const res = await apiFetch("/api/boards/user/id/" + encodeURIComponent(userId));
    if(!res) return;

    if(!res.ok){
      emptyEl.style.display = "block";
      return;
    }

    const list = await res.json();

    if(!list || list.length === 0){
      emptyEl.style.display = "block";
      return;
    }

    emptyEl.style.display = "none";
    feedEl.innerHTML = list.map(cardHtml).join("");
  }

  (async () => {
    await loadProfile();
    await loadPosts();
  })();
</script>
</body>
</html>
