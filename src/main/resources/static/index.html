<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BoardApp - Login</title>
    <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="auth-body">
<main class="auth-wrap">
    <section class="auth-card">
        <div class="auth-logo">BoardApp</div>

        <form id="loginForm" class="auth-form">
            <input id="email" class="auth-input" type="email" placeholder="이메일" autocomplete="email" required />
            <input id="password" class="auth-input" type="password" placeholder="비밀번호" autocomplete="current-password" required />

            <button class="auth-btn" type="submit">로그인</button>

            <div class="auth-divider">
                <span>또는</span>
            </div>

            <p id="msg" class="auth-msg"></p>
        </form>
    </section>

    <section class="auth-card auth-card--sub">
        <p class="auth-subtext">
            계정이 없으신가요?
            <a class="auth-link" href="/signup.html">회원가입</a>
        </p>
    </section>

    <footer class="auth-footer">
        <small>© BoardApp</small>
    </footer>
</main>

<script src="/js/auth.js"></script>
<script>
    // 이미 로그인되어 있으면 메인으로
    if (getToken()) location.href = "/main.html";

    const form = document.getElementById("loginForm");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      msg.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        msg.textContent = "이메일과 비밀번호를 입력해주세요.";
        return;
      }

      try {
        const res = await fetch("/api/users/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        if (!res.ok) {
          const t = await res.text();
          msg.textContent = "로그인 실패: " + (t || res.status);
          return;
        }

        const data = await res.json();
        if (!data?.token) {
          msg.textContent = "로그인 실패: 토큰이 없습니다.";
          return;
        }

        localStorage.setItem("boardapp_token", data.token);
        location.href = "/main.html";
      } catch (err) {
        msg.textContent = "로그인 오류: " + err;
      }
    });
</script>
</body>
</html>
